<header class="header fixed md:flex md:px-8 px-4">
  <div class="left-panel flex justify-between">
    <div class="title">Idle Bakery</div>
    <div class="ascension hidden md:block">
      <p
        class="ascension-value"
        matTooltip="Each life lesson increases the global sell value by {{lifeLessonsMultiplier() * 100}}%"
      >
        +{{ lifeLessons() }} Life Lessons
      </p>
      <p class="ascension-potential">
        Your oldest child will gain {{ potentialLifeLessons() }} life lessons if
        you retire now. 1 for every {{ lifeLessonsFactor }} pastry levels in
        total.
      </p>
    </div>
    <div class="md:hidden block">
      <button matMiniFab (click)="toggleMenu()">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </div>
  <div class="right-panel md:flex hidden">
    <ng-container *ngTemplateOutlet="moneyRef" />

    <button matMiniFab (click)="toggleAudio()" matTooltip="Toggle SFX!">
      @if (sfxEnabled()) {
        <mat-icon>volume_up</mat-icon>
      }@else {
        <mat-icon>volume_off</mat-icon> }
    </button>

    <button matButton="elevated" color="accent" (click)="toggleMusic()">
      @if (musicPlaying()) {
        <mat-icon>music_note</mat-icon>
      }@else {
        <mat-icon>music_off</mat-icon> }
      Toggle Music
    </button>

    <button
      [matTooltip]="
        'Clicking this will immediately delete all progress! You will gain a number of life lessons based on your total pastry level.'
      "
      (click)="openConfirmDialog()"
      matButton="filled"
      color="primary"
    >
      Retire Now
    </button>
  </div>
  <div class="md:hidden block">
    <ng-container *ngTemplateOutlet="moneyRef" />
  </div>
</header>

<ng-template #moneyRef>
  <div class="money">
    <img src="/fc131.png" alt="money-icon" class="md:h-16 md:w-16 h-8 w-8" />
    <p class="money-value">{{ money().toSuffixString() }}</p>
  </div>
</ng-template>
